<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 430);
const H = window.innerHeight;
canvas.width = W; canvas.height = H;


// ── SERVIDOR — nenhuma chave exposta aqui ────────────────────────────────
const SCORE_SECRET = 'REV2026';

// ── RASTREAMENTO DE TEMPO DE JOGO ─────────────────────────────────────────
let firstPlayMs = null; // momento em que o jogador começou a jogar de verdade

// Gera token HMAC para validação no servidor (inclui playTime para não ser falsificável)
async function gerarToken(score, contact, timestamp, playTime) {
  const encoder = new TextEncoder();
  const data = `${Math.floor(score)}:${contact.trim()}:${timestamp}:${Math.floor(playTime)}`;
  const key = await crypto.subtle.importKey(
    'raw', encoder.encode(SCORE_SECRET),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, encoder.encode(data));
  return btoa(String.fromCharCode(...new Uint8Array(sig)));
}

// Salva via servidor — banco nunca é acessado direto pelo jogo
async function saveScoreOnline(nickname, contact, score) {
  try {
    const playTime = firstPlayMs ? (Date.now() - firstPlayMs) : 0;
    const timestamp = Date.now();
    const token = await gerarToken(score, contact, timestamp, playTime);
    await fetch('/api/save-score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname, contact, score: Math.floor(score), timestamp, token, playTime })
    });
  } catch(e) {}
}

// Ranking também vem do servidor — zero chave no frontend
let onlineRanking = null;
async function loadOnlineRanking() {
  try {
    const r = await fetch('/api/get-ranking');
    if (r.ok) { onlineRanking = await r.json(); }
  } catch(e) { onlineRanking = null; }
}

// ── MÚSICA DE FUNDO ──────────────────────────────────────────────────────
const bgm = document.getElementById('bgm');
const btnMute = document.getElementById('btnMute');
bgm.volume = 0.32;
let musicStarted = false, musicMuted = false;
function startMusic(){ if(musicStarted)return; musicStarted=true; bgm.play().catch(()=>{}); }
btnMute.addEventListener('click', e => {
  e.stopPropagation();
  musicMuted = !musicMuted;
  bgm.muted = musicMuted;
  btnMute.textContent = musicMuted ? '🔇' : '🔊';

// ── NOME DO JOGADOR ───────────────────────────────────────────────────────
let playerName    = localStorage.getItem('rev_name')    || '';
let playerContact = localStorage.getItem('rev_contact') || '';
const modal        = document.getElementById('nameModal');
const nameInput    = document.getElementById('playerName');
const contactInput = document.getElementById('playerContact');
const btnStart     = document.getElementById('btnStartName');

function showNameModal() {
  modal.classList.add('show');
  nameInput.value    = playerName;
  contactInput.value = playerContact;
  setTimeout(() => nameInput.focus(), 100);
}
function hideNameModal() {
  const n = nameInput.value.trim().toUpperCase() || 'ANÔNIMO';
  const c = contactInput.value.trim();
  if (!c) {
    contactInput.style.border = '2px solid #ff4444';
    contactInput.style.boxShadow = '0 0 10px #ff444488';
    contactInput.placeholder = '⚠️ Obrigatório para jogar!';
    contactInput.focus();
    // Shake animation
    contactInput.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-8px)' },
      { transform: 'translateX(8px)' },
      { transform: 'translateX(-6px)' },
      { transform: 'translateX(6px)' },
      { transform: 'translateX(0)' }
    ], { duration: 300, easing: 'ease-out' });
    return;
  }
  // Reset visual caso estava com erro
  contactInput.style.border = '2px solid rgba(0,200,255,0.4)';
  contactInput.style.boxShadow = '';
  playerName = n; playerContact = c;
  localStorage.setItem('rev_name', n);
  localStorage.setItem('rev_contact', c);
  modal.classList.remove('show');
  state = 'tutorial';
}
btnStart.addEventListener('click', hideNameModal);
nameInput.addEventListener('keydown',    e => { if (e.key === 'Enter') contactInput.focus(); });
contactInput.addEventListener('keydown', e => { if (e.key === 'Enter') hideNameModal(); });
// Resetar borda vermelha quando começar a digitar
contactInput.addEventListener('input', () => {
  if (contactInput.value.trim()) {
    contactInput.style.border = '2px solid rgba(0,200,255,0.4)';
    contactInput.style.boxShadow = '';
    contactInput.placeholder = 'Instagram ou WhatsApp (privado)';
  }
});

// ── RANKING (localStorage) ────────────────────────────────────────────────
function getRanking() {
  try { return JSON.parse(localStorage.getItem('rev_ranking') || '[]'); } catch { return []; }
}
function saveToRanking(name, score) {
  let r = getRanking();
  r.push({ name, score, date: new Date().toLocaleDateString('pt-BR') });
  r.sort((a, b) => b.score - a.score);
  r = r.slice(0, 20); // guarda top 20
  localStorage.setItem('rev_ranking', JSON.stringify(r));
}

// ── LOGO SEM FUNDO BRANCO ────────────────────────────────────────────────
const IMGS = {};
const IMG_LIST = {
  fundo:'FUNDO.png', nave:'nave1.png',
  e1:'nave2.png', e2:'nave3.png', e3:'nave4.png',
  p1:'poder1.png', p3:'poder3.png', p4:'poder4.png',
  p5:'poder5.png', p6:'poder6.png', p7:'poder7.png',
  astG:'ast-grande.png', astM:'ast-medio.png', astP:'ast-pequeno.png',
  logo:'logo.png', moeda:'moeda.png'
};
let loaded = 0;
const total = Object.keys(IMG_LIST).length;
let logoProcessed = null;
const cleanImgs = {}; // imagens sem fundo cinza

function loadAll(cb) {
  Object.entries(IMG_LIST).forEach(([k, src]) => {
    const img = new Image();
    img.onload = img.onerror = () => { if (++loaded >= total) cb(); };
    img.src = src;
    IMGS[k] = img;
  });
}
function processLogo() {
  if (!imgOk('logo') || logoProcessed) return;
  const img = IMGS.logo;
  const oc = document.createElement('canvas');
  oc.width = img.naturalWidth; oc.height = img.naturalHeight;
  const ot = oc.getContext('2d');
  ot.drawImage(img, 0, 0);
  try {
    const data = ot.getImageData(0, 0, oc.width, oc.height);
    const d = data.data;
    for (let i = 0; i < d.length; i += 4) {
      const r=d[i],g=d[i+1],b=d[i+2];
      if (r>190&&g>190&&b>190) d[i+3] = Math.round(255*Math.max(0,1-(((r+g+b)/3)-190)/65));
    }
    ot.putImageData(data, 0, 0);
    logoProcessed = oc;
  } catch(e) { logoProcessed = IMGS.logo; }
}
// Remove fundo escuro/cinza dos ícones de power-up
function removeDarkBg(key) {
  if (!imgOk(key) || cleanImgs[key]) return;
  const img = IMGS[key];
  const oc = document.createElement('canvas');
  oc.width = img.naturalWidth; oc.height = img.naturalHeight;
  const ot = oc.getContext('2d'); ot.drawImage(img, 0, 0);
  try {
    const data = ot.getImageData(0, 0, oc.width, oc.height);
    const d = data.data;
    // se o canto já é transparente, imagem já tem fundo removido — usa direto
    if(d[3] < 200){ cleanImgs[key] = img; return; }
    // pega cor do canto (0,0) como cor de fundo
    const br=d[0],bg=d[1],bb=d[2];
    for (let i = 0; i < d.length; i += 4) {
      const dist = Math.abs(d[i]-br)+Math.abs(d[i+1]-bg)+Math.abs(d[i+2]-bb);
      if (dist < 60) d[i+3] = Math.round(d[i+3] * Math.max(0, dist/60));
    }
    ot.putImageData(data, 0, 0); cleanImgs[key] = oc;
  } catch(e) { cleanImgs[key] = img; }
}

// ── SOM (Web Audio API) ───────────────────────────────────────────────────
let _ac = null;
function ac() { if(!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)(); return _ac; }
function sndTone(freq, freq2, dur, vol=0.18, type='sine') {
  try { const a=ac(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.type=type;
    o.frequency.setValueAtTime(freq,a.currentTime);
    if(freq2) o.frequency.exponentialRampToValueAtTime(freq2,a.currentTime+dur);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);
  } catch(e){}
}
function sndNoise(dur, vol=0.3, freq=600) {
  try { const a=ac(),buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=a.createBufferSource(),flt=a.createBiquadFilter(),g=a.createGain();
    flt.type='lowpass';flt.frequency.value=freq;
    src.buffer=buf;src.connect(flt);flt.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    src.start();src.stop(a.currentTime+dur);
  } catch(e){}
}
const SFX = {
  shoot:    ()=>sndTone(900,400,0.08,0.05,'square'),
  hit:      ()=>{ sndNoise(0.25,0.22,300); sndTone(120,60,0.25,0.13,'sawtooth'); },
  enemyDie: ()=>{ sndNoise(0.18,0.14,500); sndTone(220,80,0.18,0.08); },
  coin:     ()=>{ sndTone(1200,1600,0.06,0.08); setTimeout(()=>sndTone(1600,2000,0.06,0.07),60); },
  powerup:  ()=>{ [0,80,160].forEach((t,i)=>setTimeout(()=>sndTone([600,800,1000][i],[800,1000,1300][i],0.12,0.09),t)); },
  special:  ()=>{ sndTone(200,800,0.4,0.2,'sawtooth'); sndTone(400,1200,0.4,0.14); },
  ready:    ()=>{ sndTone(600,1200,0.2,0.16,'square'); setTimeout(()=>sndTone(800,1600,0.25,0.2,'square'),200); },
  wave:     ()=>{ [0,150,300].forEach((t,i)=>setTimeout(()=>sndTone([400,600,800][i],[600,800,1200][i],0.2,0.13),t)); },
  laser:    ()=>{ sndTone(80,400,0.5,0.22,'sawtooth'); sndTone(2000,500,0.5,0.10); },
};

// ── STATE ─────────────────────────────────────────────────────────────────
let state = 'loading';
let score = 0, highScore = parseInt(localStorage.getItem('rev_hs') || '0');
let lives = 3, waveNum = 0, waveTimer = 0, frame = 0;
let shakeAmt = 0, shakeX = 0, shakeY = 0;
let combo = 0, comboTimer = 0, flashAlpha = 0;
let specialReadyAnim = 0;
const CHARGE_MAX = 8;
let chargeKills = 0, specialReady = false, specialActive = false, specialTimer = 0;
const SPECIAL_DUR = 55;
const BTN = { x: W-118, y: H-90, w: 108, h: 76 };
let activePower = { type: null, timer: 0, max: 0 };

// ── ESTRELAS ──────────────────────────────────────────────────────────────
const LAYERS = [
  {stars:[],spd:0.3,sz:0.8,op:0.2},{stars:[],spd:0.9,sz:1.4,op:0.35},{stars:[],spd:1.8,sz:2.2,op:0.6}
];
LAYERS.forEach(L=>{for(let i=0;i<60;i++)L.stars.push({x:Math.random()*W,y:Math.random()*H});});

// ── PLAYER ────────────────────────────────────────────────────────────────
const P = { x:W/2,y:H-120,targetX:W/2,targetY:H-120,w:70,h:80,bullets:[],shotTimer:0,shotDelay:13,invTimer:0,hasShield:false };
let enemies=[],eBullets=[],particles=[],powerups=[],coins=[],asteroids=[];
let asteroidTimer=0;

// ── INPUT ─────────────────────────────────────────────────────────────────
let touchX=null,touchY=null,touching=false;
const keys={l:false,r:false};

// ── DETECÇÃO DE DISPOSITIVO ───────────────────────────────────────────────
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const MAX_PARTICLES = isMobile ? 70 : 200;
const THRUSTER_FREQ = isMobile ? 3 : 1; // adiciona partícula de propulsor a cada N frames
const GLOW_SCALE = isMobile ? 0.4 : 1.0; // reduz blur no celular

// ── HELPERS ───────────────────────────────────────────────────────────────
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
function glow(col,blur){ctx.shadowColor=col;ctx.shadowBlur=blur*GLOW_SCALE;}
function noGlow(){ctx.shadowBlur=0;}
function imgOk(k){return IMGS[k]&&IMGS[k].complete&&IMGS[k].naturalWidth>0;}

// ── PARTÍCULAS ────────────────────────────────────────────────────────────
function explode(x,y,col,n,spd){
  for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(spd*0.3,spd);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rnd(0.025,0.055),sz:rnd(2,6),col,kind:'spark'});}
  for(let i=0;i<n*0.35|0;i++){const a=rnd(0,Math.PI*2),s=rnd(0.5,spd*0.5);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rnd(0.015,0.03),sz:rnd(5,14),col,kind:'glow'});}
  particles.push({x,y,vx:0,vy:0,life:1,decay:0.055,sz:0,maxSz:70,col,kind:'ring'});
}
function thruster(x,y){particles.push({x:x+rnd(-5,5),y,vx:rnd(-0.4,0.4),vy:rnd(1.2,3.2),life:1,decay:rnd(0.09,0.16),sz:rnd(3,8),col:Math.random()>0.5?'#00d4ff':'#fff',kind:'thrust'});}
function tickParticles(){
  if(particles.length>MAX_PARTICLES)particles.splice(0,particles.length-MAX_PARTICLES);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.life-=p.decay;if(p.life<=0)particles.splice(i,1);}
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.kind==='ring'){glow(p.col,14);ctx.strokeStyle=p.col;ctx.lineWidth=2.5*p.life;ctx.beginPath();ctx.arc(p.x,p.y,p.maxSz*(1-p.life),0,Math.PI*2);ctx.stroke();}
    else{glow(p.col,p.kind==='glow'?22:9);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(p.kind==='thrust'?p.life:Math.max(0.2,p.life)),0,Math.PI*2);ctx.fill();}
    noGlow();
  });
  ctx.globalAlpha=1;
}

// ── FUNDO (cache estático para não redesenhar toda frame) ─────────────────
let bgCache = null;
function buildBgCache(){
  bgCache = document.createElement('canvas');
  bgCache.width = W; bgCache.height = H;
  const bc = bgCache.getContext('2d');
  bc.fillStyle='#04001a'; bc.fillRect(0,0,W,H);
  if(imgOk('fundo')){
    const iw=IMGS.fundo.naturalWidth,ih=IMGS.fundo.naturalHeight;
    const sc=Math.max(W/iw,H/ih),dw=iw*sc,dh=ih*sc;
    bc.drawImage(IMGS.fundo,(W-dw)/2,(H-dh)/2,dw,dh);
  }
  const vg=bc.createLinearGradient(0,0,W,0);
  vg.addColorStop(0,'rgba(0,0,10,0.5)');vg.addColorStop(0.15,'rgba(0,0,10,0)');
  vg.addColorStop(0.85,'rgba(0,0,10,0)');vg.addColorStop(1,'rgba(0,0,10,0.5)');
  bc.fillStyle=vg; bc.fillRect(0,0,W,H);
}
function drawBG(){
  if(!bgCache) buildBgCache();
  ctx.drawImage(bgCache,0,0); // copia o fundo de uma vez (muito mais rápido)
  LAYERS.forEach(L=>{
    ctx.fillStyle=`rgba(255,255,255,${L.op})`;
    ctx.beginPath(); // batch: todas as estrelas da camada num único path
    L.stars.forEach(s=>{ctx.moveTo(s.x+L.sz/2,s.y);ctx.arc(s.x,s.y,L.sz/2,0,Math.PI*2);s.y+=L.spd;if(s.y>H){s.y=0;s.x=Math.random()*W;}});
    ctx.fill();
  });
}

// ── DESENHOS ──────────────────────────────────────────────────────────────
function drawShip(x,y,alpha){
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;
  const ec=specialActive?'rgba(180,0,255,0.8)':'rgba(0,180,255,0.7)';
  const eg=ctx.createRadialGradient(0,P.h/2-5,0,0,P.h/2,28);
  eg.addColorStop(0,ec);eg.addColorStop(1,'rgba(0,20,200,0)');
  ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(0,P.h/2-5,14,24,0,0,Math.PI*2);ctx.fill();
  glow(specialActive?'#cc00ff':P.hasShield?'#00aaff':'#0088ff',specialActive?30:12);
  if(imgOk('nave'))ctx.drawImage(IMGS.nave,-P.w/2,-P.h/2,P.w,P.h);
  if(P.hasShield){noGlow();glow('#00d4ff',20);ctx.strokeStyle='rgba(0,200,255,0.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,P.w/2+12,0,Math.PI*2);ctx.stroke();}
  noGlow();ctx.restore();ctx.globalAlpha=1;
}
function drawEnemy(e){
  const key=e.t===1?'e1':e.t===2?'e2':'e3';
  const pulse=Math.sin(frame*0.1+e.x*0.02)*0.3+0.7;
  const gc=['#ff00ee','#00ffcc','#ff6600'][e.t-1];
  ctx.save();ctx.translate(e.x,e.y);glow(gc,14*pulse);
  if(imgOk(key))ctx.drawImage(IMGS[key],-e.w/2,-e.h/2,e.w,e.h);
  noGlow();ctx.restore();
}
function drawAsteroid(ast){
  const key=ast.size==='grande'?'astG':ast.size==='medio'?'astM':'astP';
  ctx.save();ctx.translate(ast.x,ast.y);ctx.rotate(ast.angle);
  if(imgOk(key))ctx.drawImage(IMGS[key],-ast.w/2,-ast.h/2,ast.w,ast.h);
  else{ctx.fillStyle='#666';ctx.beginPath();ctx.arc(0,0,ast.w/2,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}
function drawPowerup(pu){
  const km={laser:'p1',rapid:'p3',shield:'p4',triple:'p5',missile:'p6',mega:'p7'};
  const k=km[pu.type];
  removeDarkBg(k); // remove fundo cinza lazy
  const bob=Math.sin(frame*0.09+pu.x*0.01)*5;
  const pulse=Math.sin(frame*0.12+pu.x)*0.15+0.85;
  ctx.save();ctx.translate(pu.x,pu.y+bob);ctx.scale(pulse,pulse);
  glow('#cc88ff',22);
  const src=cleanImgs[k]||IMGS[k];
  if(src){ctx.globalCompositeOperation='screen';ctx.drawImage(src,-40,-40,80,80);ctx.globalCompositeOperation='source-over';}
  noGlow();ctx.restore();
}
function drawCoin(c){
  const bob=Math.sin(frame*0.1+c.x)*3;
  const sx=Math.abs(Math.cos(frame*0.08+c.x*0.05));
  ctx.save();ctx.translate(c.x,c.y+bob);ctx.scale(sx,1);glow('#ffd700',12);
  if(imgOk('moeda'))ctx.drawImage(IMGS.moeda,-26,-26,52,52);
  noGlow();ctx.restore();
}
function drawBullet(x,y,isPlayer,isMissile){

// ── ROUND RECT ────────────────────────────────────────────────────────────
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// ── WAVES ─────────────────────────────────────────────────────────────────
const WAVES=[
  [{t:1,n:8}],
  [{t:1,n:8},{t:2,n:4}],
  [{t:1,n:8},{t:2,n:5},{t:3,n:2}],
  [{t:1,n:10},{t:2,n:6},{t:3,n:3}],
  [{t:1,n:10},{t:2,n:7},{t:3,n:4}],
  [{t:1,n:12},{t:2,n:8},{t:3,n:5}]
];
function spawnWave(){
  waveNum++;enemies=[];eBullets=[];
  const cfg=WAVES[Math.min(waveNum-1,WAVES.length-1)];let yOff=65;
  cfg.forEach(g=>{
    const sp=Math.min(55,(W-70)/g.n),sx=(W-sp*(g.n-1))/2;
    for(let i=0;i<g.n;i++){
      let hp=g.t===1?1:g.t===2?3:5;if(waveNum>3)hp+=Math.floor((waveNum-3)/2);
      const ew=g.t===1?50:g.t===2?65:80;
      // tipo 1 começa a atirar na onda 3; todos com sTimer menor = mais agressivo
      const sMin=waveNum<3?99999:Math.max(80,190-waveNum*10);
      const sMax=Math.max(120,320-waveNum*18);
      enemies.push({x:sx+i*sp,y:yOff,bx:sx+i*sp,by:yOff,t:g.t,hp,mhp:hp,phase:rnd(0,Math.PI*2),amp:14+i*2.5,spd:0.18+waveNum*0.03,sTimer:rnd(sMin,sMax)|0,entered:false,entryY:yOff,w:ew,h:ew});
    }
    yOff+=80;
  });
}

function fireSpecial(){
  if(!specialReady||specialActive)return;
  SFX.laser();specialActive=true;specialTimer=SPECIAL_DUR;specialReady=false;chargeKills=0;shakeAmt=22;flashAlpha=0.55;
  explode(P.x,P.y-P.h/2,'#cc00ff',25,7);explode(P.x,P.y-P.h/2,'#fff',10,10);
}
function collectPower(type){
  if(type==='laser'){chargeKills=CHARGE_MAX;specialReady=true;specialReadyAnim=160;return;}
  if(type==='shield'){P.hasShield=true;return;}
  activePower={type,timer:720,max:720};
  P.shotDelay=type==='rapid'?6:type==='mega'?4:13;
}

// ── UPDATE ────────────────────────────────────────────────────────────────
function update(){
  frame++;
  if(shakeAmt>0){shakeX=rnd(-shakeAmt,shakeAmt);shakeY=rnd(-shakeAmt,shakeAmt);shakeAmt*=0.78;if(shakeAmt<0.5){shakeAmt=shakeX=shakeY=0;}}
  if(flashAlpha>0)flashAlpha*=0.82;
  if(comboTimer>0){comboTimer--;if(comboTimer<=0)combo=0;}
  if(activePower.type){activePower.timer--;if(activePower.timer<=0){activePower={type:null,timer:0,max:0};P.shotDelay=13;}}
  if(touching&&touchX!==null){P.targetX=touchX;P.targetY=touchY||P.targetY;}
  if(keys.l)P.targetX-=5;if(keys.r)P.targetX+=5;
  P.targetX=Math.max(P.w/2,Math.min(W-P.w/2,P.targetX));
  P.targetY=Math.max(H*0.32,Math.min(H-P.h/2-10,P.targetY));
  P.x=lerp(P.x,P.targetX,0.22);
  P.y=lerp(P.y,P.targetY,0.18);
  if(frame%THRUSTER_FREQ===0)thruster(P.x,P.y+P.h/2-4);
  P.shotTimer--;
  if(P.shotTimer<=0){
    P.shotTimer=P.shotDelay;const vy=-10;
    SFX.shoot();
    if(activePower.type==='triple'){P.bullets.push({x:P.x,y:P.y-P.h/2,vx:0,vy});P.bullets.push({x:P.x,y:P.y-P.h/2,vx:-2.5,vy:vy*0.95});P.bullets.push({x:P.x,y:P.y-P.h/2,vx:2.5,vy:vy*0.95});}
    else if(activePower.type==='missile'){P.bullets.push({x:P.x,y:P.y-P.h/2,vx:0,vy:-6,homing:true});}
    else if(activePower.type==='mega'){P.bullets.push({x:P.x,y:P.y-P.h/2,vx:0,vy});P.bullets.push({x:P.x-12,y:P.y-P.h/2+10,vx:-1,vy:vy*0.98});P.bullets.push({x:P.x+12,y:P.y-P.h/2+10,vx:1,vy:vy*0.98});}
    else{P.bullets.push({x:P.x,y:P.y-P.h/2,vx:0,vy});}
  }
  for(let i=P.bullets.length-1;i>=0;i--){
    const b=P.bullets[i];
    if(b.homing&&enemies.length>0){let near=null,md=Infinity;enemies.forEach(e=>{if(!e.entered)return;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<md){md=d;near=e;}});if(near){const a=Math.atan2(near.y-b.y,near.x-b.x);b.vx=lerp(b.vx,Math.cos(a)*8,0.12);b.vy=lerp(b.vy,Math.sin(a)*8,0.12);}}
    b.x+=b.vx;b.y+=b.vy;if(b.y<-30||b.y>H+30||b.x<-30||b.x>W+30)P.bullets.splice(i,1);
  }
  eBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});eBullets=eBullets.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20);
  if(P.invTimer>0)P.invTimer--;
  enemies.forEach(e=>{
    if(!e.entered){e.y+=1.6;if(e.y>=e.entryY)e.entered=true;return;}
    e.phase+=0.014;e.x=e.bx+Math.sin(e.phase)*e.amp;e.by+=e.spd*0.07;e.y=e.by+Math.sin(e.phase*0.55)*7;
    const shoots=e.t>=2||(e.t===1&&waveNum>=3);
    if(shoots){e.sTimer--;if(e.sTimer<=0){const sMin=Math.max(80,190-waveNum*10),sMax=Math.max(120,320-waveNum*18);e.sTimer=rnd(sMin,sMax)|0;const a=Math.atan2(P.y-e.y,P.x-e.x);const spd=1.8+waveNum*0.12;eBullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd+0.5});}}
  });
  enemies=enemies.filter(e=>e.y<H+80);
  asteroidTimer++;
  if(asteroidTimer>=Math.max(130,260-waveNum*14)){
    asteroidTimer=0;
    const sizes=['grande','medio','medio','pequeno','pequeno'];
    const sz=sizes[Math.floor(Math.random()*sizes.length)];
    const wBonus=1+waveNum*0.12;
    const dm={grande:{w:75,h:75,sp:0.7*wBonus},medio:{w:52,h:52,sp:1.1*wBonus},pequeno:{w:35,h:35,sp:1.6*wBonus}};
    const d=dm[sz];
    asteroids.push({x:rnd(d.w,W-d.w),y:-d.h,vx:rnd(-0.8,0.8),vy:d.sp+rnd(0,0.8),angle:rnd(0,Math.PI*2),rotSpd:rnd(-0.03,0.03),size:sz,w:d.w,h:d.h});
  }
  for(let i=asteroids.length-1;i>=0;i--){const ast=asteroids[i];ast.x+=ast.vx;ast.y+=ast.vy;ast.angle+=ast.rotSpd;if(ast.y>H+100)asteroids.splice(i,1);}
  for(let i=powerups.length-1;i>=0;i--){const pu=powerups[i];pu.y+=1.0;if(pu.y>H+40){powerups.splice(i,1);continue;}if(Math.abs(pu.x-P.x)<40&&Math.abs(pu.y-P.y)<40){collectPower(pu.type);SFX.powerup();explode(pu.x,pu.y,'#ffff00',12,4);powerups.splice(i,1);}}
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.y+=1.0;if(c.y>H+40){coins.splice(i,1);continue;}if(Math.abs(c.x-P.x)<30&&Math.abs(c.y-P.y)<30){score+=150;combo++;comboTimer=50;SFX.coin();explode(c.x,c.y,'#ffd700',8,3);coins.splice(i,1);}}
  if(specialActive){
    specialTimer--;const bw=22;
    for(let ei=enemies.length-1;ei>=0;ei--){const e=enemies[ei];if(!e.entered)continue;if(Math.abs(e.x-P.x)<bw+e.w*0.4){const cols=['#ff00ee','#00ffcc','#ff6600'];explode(e.x,e.y,cols[e.t-1],22,5.5);explode(e.x,e.y,'#fff',8,9);score+=(e.t===1?40:e.t===2?80:180)*Math.min(4,Math.max(1,combo));combo++;comboTimer=50;enemies.splice(ei,1);}}
    eBullets=eBullets.filter(b=>Math.abs(b.x-P.x)>=bw);
    if(specialTimer<=0)specialActive=false;
  }
  for(let bi=P.bullets.length-1;bi>=0;bi--){
    const b=P.bullets[bi];let hit=false;
    for(let ei=enemies.length-1;ei>=0;ei--){
      const e=enemies[ei];if(!e.entered)continue;
      if(b.x>e.x-e.w/2&&b.x<e.x+e.w/2&&b.y>e.y-e.h/2&&b.y<e.y+e.h/2){
        const cols=['#ff00ee','#00ffcc','#ff6600'];explode(b.x,b.y,cols[e.t-1],6,3);e.hp--;
        if(e.hp<=0){
          explode(e.x,e.y,cols[e.t-1],28,5.5);explode(e.x,e.y,'#fff',10,9);
          score+=(e.t===1?40:e.t===2?80:180)*Math.min(4,Math.max(1,combo));combo++;comboTimer=50;shakeAmt=6;
          SFX.enemyDie();if(chargeKills<CHARGE_MAX){chargeKills++;if(chargeKills===CHARGE_MAX){specialReady=true;specialReadyAnim=160;SFX.ready();}}
          const r=Math.random();
          if(r<0.12){const tp=['laser','rapid','shield','triple','missile','mega'];powerups.push({x:e.x,y:e.y,type:tp[Math.floor(Math.random()*tp.length)]});}
          else if(r<0.32){coins.push({x:e.x,y:e.y});}
          enemies.splice(ei,1);
        }
        hit=true;break;
      }
    }
    if(hit){P.bullets.splice(bi,1);continue;}
  }
  if(P.invTimer<=0){
    for(let bi=eBullets.length-1;bi>=0;bi--){const b=eBullets[bi];if(b.x>P.x-P.w/2+10&&b.x<P.x+P.w/2-10&&b.y>P.y-P.h/2+10&&b.y<P.y+P.h/2-10){eBullets.splice(bi,1);hitPlayer();break;}}
    for(let ei=enemies.length-1;ei>=0;ei--){const e=enemies[ei];if(!e.entered)continue;if(Math.abs(e.x-P.x)<(P.w+e.w)/2-20&&Math.abs(e.y-P.y)<(P.h+e.h)/2-20){explode(e.x,e.y,'#ff00ee',12,4);enemies.splice(ei,1);hitPlayer();break;}}
    for(let ai=asteroids.length-1;ai>=0;ai--){const a=asteroids[ai];if(Math.abs(a.x-P.x)<(P.w+a.w)/2-15&&Math.abs(a.y-P.y)<(P.h+a.h)/2-15){explode(a.x,a.y,'#aaaaaa',20,5);explode(a.x,a.y,'#ff8800',10,8);asteroids.splice(ai,1);if(P.hasShield){P.hasShield=false;shakeAmt=8;explode(P.x,P.y,'#00aaff',15,4);SFX.hit();}else{hitPlayer();}break;}}
  }
  tickParticles();
  if(enemies.length===0&&state==='playing'){score+=500;flashAlpha=0.18;state='wave_intro';waveTimer=90;}
  if(state==='wave_intro'){waveTimer--;if(waveTimer<=0){state='playing';SFX.wave();spawnWave();}}
}

function hitPlayer(){
  if(P.hasShield){P.hasShield=false;shakeAmt=8;explode(P.x,P.y,'#00aaff',15,4);return;}
  lives--;score=Math.max(0,score-5000);P.invTimer=120;combo=0;comboTimer=0;chargeKills=0;specialReady=false;shakeAmt=16;
  activePower={type:null,timer:0,max:0};P.shotDelay=13;
  explode(P.x,P.y,'#00d4ff',22,5);
  SFX.hit();if(lives<=0)setTimeout(()=>{
    saveToRanking(playerName,score);
    if(score>highScore){highScore=score;localStorage.setItem('rev_hs',highScore);}
    saveScoreOnline(playerName, playerContact, score); // salva no servidor
    onlineRanking = null; // reset para mostrar "carregando..."
    loadOnlineRanking(); // carrega ranking atualizado
    state='gameover';
  },600);
}

    {icon:'p4',col:'#00ccff',title:'POWER-UPS',desc:'Pegue os itens que caem dos inimigos'},
    {icon:'p1',col:'#cc00ff',title:'LASER ESPECIAL ⚡',desc:'Mate 8 sem tomar dano → use o LASER'},
    {icon:'astM',col:'#ff8800',title:'ASTEROIDES ☄️',desc:'Indestrutíveis — DESVIE deles!'},
    {icon:'moeda',col:'#ffd700',title:'MOEDAS +150 pts',desc:'Passe por cima para coletar'},
  ];
  items.forEach((item,i)=>{
    const y=80+i*80;
    ctx.fillStyle='rgba(255,255,255,0.05)';roundRect(10,y-2,W-20,68,10);ctx.fill();
    if(imgOk(item.icon)){removeDarkBg(item.icon);glow(item.col,10);const src=cleanImgs[item.icon]||IMGS[item.icon];ctx.globalCompositeOperation='screen';ctx.drawImage(src,14,y+4,50,50);ctx.globalCompositeOperation='source-over';noGlow();}
    ctx.textAlign='left';glow(item.col,8);ctx.fillStyle=item.col;ctx.font='bold 14px monospace';ctx.fillText(item.title,74,y+22);noGlow();
    ctx.fillStyle='rgba(230,225,255,0.85)';ctx.font='13px monospace';ctx.fillText(item.desc,74,y+42);
  });
  // Prêmios
  const ty=80+items.length*80+6;
  ctx.fillStyle='rgba(255,210,0,0.07)';roundRect(10,ty,W-20,88,10);ctx.fill();
  ctx.textAlign='center';glow('#ffd700',10);ctx.fillStyle='#ffd700';ctx.font='bold 14px monospace';ctx.fillText('🏆 RANKING DE PRÊMIOS',W/2,ty+18);noGlow();
  ctx.fillStyle='rgba(255,220,100,0.9)';ctx.font='12px monospace';ctx.fillText('🎟️ 1°-3° · 1 par de ingressos',W/2,ty+36);
  ctx.fillStyle='rgba(100,255,180,0.9)';ctx.fillText('👕 4°-6° · Camisa Revolution',W/2,ty+52);
  ctx.fillStyle='rgba(200,150,255,0.9)';ctx.fillText('🏷️ 7°-10° · 20% de desconto',W/2,ty+68);
  // Botão
  const bp=Math.sin(frame*0.1)*0.2+0.8;
  glow('#00ff88',18*bp);ctx.fillStyle='rgba(0,255,136,0.15)';ctx.strokeStyle=`rgba(0,255,136,${0.9*bp})`;ctx.lineWidth=2;
  roundRect(W/2-120,H-68,240,52,14);ctx.fill();ctx.stroke();
  ctx.fillStyle='#00ff88';ctx.font='bold 20px monospace';ctx.fillText('JOGAR AGORA!',W/2,H-36);noGlow();
  drawParticles();
}

// ── TELA INICIAL ──────────────────────────────────────────────────────────
function drawStart(){
  const p=Math.sin(frame*0.05)*0.3+0.7;ctx.textAlign='center';
  processLogo();
  if(imgOk('logo')){
    const src=logoProcessed||IMGS.logo,lw=Math.min(W-30,320),lh=lw*(IMGS.logo.naturalHeight/IMGS.logo.naturalWidth);
    glow('#cc00ff',25*p);ctx.drawImage(src,(W-lw)/2,H*0.03,lw,lh);noGlow();
  }else{glow('#cc00ff',45*p);ctx.fillStyle='#ff00ff';ctx.font='bold 44px monospace';ctx.fillText('REVOLUTION',W/2,H*0.14);noGlow();}
  if(imgOk('nave')){glow('#0088ff',14);ctx.drawImage(IMGS.nave,W/2-35,H*0.27,70,80);noGlow();}
  if(imgOk('e1')){glow('#ff00ee',10);ctx.drawImage(IMGS.e1,W/2-115,H*0.46,50,50);noGlow();}
  if(imgOk('e2')){glow('#00ffcc',10);ctx.drawImage(IMGS.e2,W/2-25,H*0.46,60,60);noGlow();}
  if(imgOk('e3')){glow('#ff6600',10);ctx.drawImage(IMGS.e3,W/2+65,H*0.46,55,55);noGlow();}
  const bp=Math.sin(frame*0.09)*0.2+0.8;
  glow('#00ff88',18*bp);ctx.fillStyle='rgba(0,255,136,0.13)';ctx.strokeStyle=`rgba(0,255,136,${0.85*bp})`;ctx.lineWidth=2;
  roundRect(W/2-115,H*0.75-26,230,52,14);ctx.fill();ctx.stroke();
  ctx.fillStyle='#00ff88';ctx.font='bold 20px monospace';ctx.fillText('TOQUE PARA JOGAR',W/2,H*0.75+8);
  ctx.fillStyle='rgba(200,200,255,0.45)';ctx.font='12px monospace';
  ctx.fillText('🏆 Top 10 do ranking ganham prêmios!',W/2,H*0.9);
  noGlow();drawParticles();
}

// ── RANKING ───────────────────────────────────────────────────────────────
function drawRanking(){
  const src = onlineRanking || getRanking().map(e=>({nickname:e.name,score:e.score}));
  const r = src.slice(0,10);
  const prizes=[
    '🎟️ 1 par de ingressos','🎟️ 1 par de ingressos','🎟️ 1 par de ingressos',
    '👕 Camisa Revolution','👕 Camisa Revolution','👕 Camisa Revolution',
    '🏷️ 20% de desconto','🏷️ 20% de desconto','🏷️ 20% de desconto','🏷️ 20% de desconto'
  ];
  function pCol(i){return i<3?'#ffd700':i<6?'#00ee88':'#cc77ff';}
  ctx.textAlign='center';
  glow('#ffd700',20);ctx.fillStyle='#ffd700';ctx.font='bold 22px monospace';ctx.fillText('🏆 RANKING GLOBAL',W/2,44);noGlow();
  if(!onlineRanking){ctx.fillStyle='rgba(0,200,255,0.5)';ctx.font='11px monospace';ctx.fillText('⏳ sincronizando...',W/2,62);}
  else{ctx.fillStyle='rgba(255,220,100,0.6)';ctx.font='11px monospace';ctx.fillText('Top 10 ganham prêmios da Revolution!',W/2,62);}
  r.forEach((entry,i)=>{
    const col=pCol(i),y=72+i*46,nm=entry.nickname||entry.name||'???';
    const rgb=i<3?'255,210,0':i<6?'0,220,130':'180,100,255';
    ctx.fillStyle=`rgba(${rgb},0.07)`;roundRect(10,y,W-20,38,7);ctx.fill();
    ctx.strokeStyle=`rgba(${rgb},0.28)`;ctx.lineWidth=1;roundRect(10,y,W-20,38,7);ctx.stroke();
    ctx.textAlign='left';
    glow(col,10);ctx.fillStyle=col;ctx.font='bold 14px monospace';ctx.fillText(`${i+1}°`,15,y+24);noGlow();
    ctx.fillStyle=col;ctx.font='bold 13px monospace';ctx.fillText(nm.substring(0,13),40,y+14);
    ctx.fillStyle=`rgba(${rgb},0.75)`;ctx.font='10px monospace';ctx.fillText(prizes[i],40,y+30);
    ctx.textAlign='right';glow(col,8);ctx.fillStyle=col;ctx.font='bold 13px monospace';ctx.fillText(entry.score.toLocaleString(),W-12,y+24);noGlow();
  });
  if(r.length===0){ctx.fillStyle='rgba(180,150,220,0.5)';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Seja o primeiro a pontuar!',W/2,140);}
  // Regras de inatividade
  const ry=72+10*46+14;
  ctx.textAlign='center';ctx.font='10px monospace';
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillText('⏱️  24h sem jogar = -10% · 48h = -19% · 72h = sai do ranking',W/2,ry);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillText('Qualquer partida com o mesmo contato conta para manter posição',W/2,ry+15);
}

// ── GAME OVER ─────────────────────────────────────────────────────────────
function drawGameOver(){
  ctx.textAlign='center';
  // Logo compacto
  if(imgOk('logo')&&logoProcessed){const lw=160,lh=lw*(IMGS.logo.naturalHeight/IMGS.logo.naturalWidth);ctx.globalAlpha=0.9;ctx.drawImage(logoProcessed,(W-lw)/2,6,lw,lh);ctx.globalAlpha=1;}
  glow('#ff0044',30);ctx.fillStyle='#ff2255';ctx.font='bold 28px monospace';ctx.fillText('GAME OVER',W/2,H*0.15);noGlow();
  // Nome + pontuação compactos
  ctx.fillStyle='rgba(200,170,255,0.7)';ctx.font='12px monospace';ctx.fillText(playerName,W/2,H*0.20);
  glow('#00d4ff',12);ctx.fillStyle='#00d4ff';ctx.font='bold 22px monospace';ctx.fillText(score.toLocaleString(),W/2,H*0.26);noGlow();
  if(score>0&&score>=highScore){glow('#ffff00',18);ctx.fillStyle='#ffff00';ctx.font='bold 13px monospace';ctx.fillText('★ NOVO RECORDE! ★',W/2,H*0.31);noGlow();}
  // Ranking top 10
  const src=onlineRanking||getRanking().map(e=>({nickname:e.name,score:e.score}));
  const rk=src.slice(0,10);
  function goCol(i){return i<3?'#ffd700':i<6?'#00ee88':'#cc77ff';}
  ctx.textAlign='center';ctx.fillStyle='rgba(255,210,0,0.8)';ctx.font='bold 12px monospace';
  ctx.fillText(onlineRanking?'🏆 TOP 10 GLOBAL':'🏆 TOP 10 (sincronizando...)',W/2,H*0.35);
  const rowH=Math.floor((H*0.56)/10); // distribui espaço disponível entre 10 linhas
  rk.forEach((e,i)=>{
    const col=goCol(i),y=H*0.38+i*rowH,nm=(e.nickname||e.name||'???');
    const rgb=i<3?'255,210,0':i<6?'0,220,130':'180,100,255';
    ctx.fillStyle=`rgba(${rgb},0.07)`;roundRect(10,y-14,W-20,rowH-2,5);ctx.fill();
    ctx.textAlign='left';
    glow(col,6);ctx.fillStyle=col;ctx.font=`bold ${i<3?13:12}px monospace`;
    ctx.fillText(`${i+1}°`,14,y+2);
    ctx.fillStyle=i<3?col:'rgba(220,215,255,0.85)';ctx.font=`${i<3?'bold ':''}12px monospace`;
    ctx.fillText(nm.substring(0,12),36,y+2);
    ctx.textAlign='right';ctx.fillStyle=col;ctx.font=`bold ${i<3?13:12}px monospace`;
    ctx.fillText(e.score.toLocaleString(),W-12,y+2);noGlow();
  });
  // Regras de inatividade (compacto)
  const rulesY=H*0.38+10*rowH+6;
  ctx.textAlign='center';ctx.font='9px monospace';
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillText('⏱️ 24h=-10%  48h=-19%  72h=sai · qualquer partida mantém posição',W/2,rulesY);
  // Botão
  const btnY=rulesY+16;
  const bp=Math.sin(frame*0.09)*0.2+0.8;
  glow('#00ff88',16*bp);ctx.fillStyle='rgba(0,255,136,0.13)';ctx.strokeStyle=`rgba(0,255,136,${0.85*bp})`;ctx.lineWidth=2;
  roundRect(W/2-115,btnY,230,44,12);ctx.fill();ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#00ff88';ctx.font='bold 16px monospace';ctx.fillText('JOGAR NOVAMENTE',W/2,btnY+28);
  noGlow();drawParticles();
}

// ── LOADING ───────────────────────────────────────────────────────────────
function drawLoading(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const p=Math.sin(frame*0.1)*0.3+0.7;
  glow('#cc00ff',20*p);ctx.fillStyle='#ff00ff';ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText('REVOLUTION',W/2,H*0.45);noGlow();
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='14px monospace';ctx.fillText('CARREGANDO...',W/2,H*0.55);
  ctx.fillStyle='rgba(255,255,255,0.1)';roundRect(W/2-80,H*0.62,160,8,4);ctx.fill();
  glow('#cc00ff',8);ctx.fillStyle='#cc00ff';roundRect(W/2-80,H*0.62,160*(loaded/total),8,4);ctx.fill();noGlow();
}

// ── DRAW PRINCIPAL ────────────────────────────────────────────────────────
function draw(){
  if(state==='loading'){frame++;drawLoading();return;}
  ctx.save();ctx.translate(shakeX,shakeY);drawBG();
  if(state==='start'){drawStart();}
  else if(state==='tutorial'){drawTutorial();}
  else if(state==='gameover'){drawGameOver();}
  else{
    asteroids.forEach(a=>drawAsteroid(a));
    enemies.forEach(e=>drawEnemy(e));
    eBullets.forEach(b=>drawBullet(b.x,b.y,false,false));
    P.bullets.forEach(b=>drawBullet(b.x,b.y,true,b.homing));
    powerups.forEach(pu=>drawPowerup(pu));
    coins.forEach(c=>drawCoin(c));
    const blink=P.invTimer>0&&Math.floor(P.invTimer/6)%2===0;
    if(!blink)drawShip(P.x,P.y,1);
    drawParticles();
    drawLaser(); // laser na frente de tudo
    if(flashAlpha>0.01){ctx.globalAlpha=flashAlpha;ctx.fillStyle='rgba(180,0,255,1)';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    drawSpecialReadyAnim();
    drawHUD();
    if(state==='wave_intro'){
      const t1=waveTimer/90,a=Math.min(t1*3,1)*Math.min((1-t1)*3,1);
      ctx.globalAlpha=a;glow('#00d4ff',35);ctx.fillStyle='#00d4ff';ctx.font='bold 40px monospace';ctx.textAlign='center';
      ctx.fillText('WAVE '+(waveNum+1),W/2,H/2);ctx.font='16px monospace';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText('PREPARE-SE!',W/2,H/2+38);
      noGlow();ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

function animateBG(){
  frame++;tickParticles();
  LAYERS.forEach(L=>L.stars.forEach(s=>{s.y+=L.spd;if(s.y>H){s.y=0;s.x=Math.random()*W;}}));
  if(state==='start')thruster(W/2,H*0.27+80);
}

function loop(){
  if(state==='loading'){if(loaded>=total)state='start';draw();}
  else if(state==='playing'||state==='wave_intro'){update();draw();}
  else{animateBG();draw();}
  requestAnimationFrame(loop);
}

// ── RESET ─────────────────────────────────────────────────────────────────
function startGame(){
  // Marca o momento do primeiro jogo real (acumula entre tentativas)
  if(!firstPlayMs) firstPlayMs = Date.now();

  // Fecha o AudioContext para liberar memória acumulada de sons
  if(_ac){ try{ _ac.close(); }catch(e){} _ac=null; musicStarted=false; }

  // Esvazia arrays sem criar novos objetos (mais eficiente pro GC)
  enemies.length=0; eBullets.length=0; particles.length=0;
  P.bullets.length=0; powerups.length=0; coins.length=0; asteroids.length=0;

  // Reinicia estado
  state='wave_intro'; waveTimer=70; score=0; lives=3; waveNum=0; frame=0;
  P.x=P.targetX=W/2; P.y=P.targetY=H-120; P.invTimer=0; P.hasShield=false;
  combo=0; comboTimer=0; chargeKills=0; specialReady=false; specialActive=false;
  specialTimer=0; flashAlpha=0; specialReadyAnim=0; shakeAmt=0; shakeX=0; shakeY=0;
  activePower={type:null,timer:0,max:0}; P.shotDelay=13; asteroidTimer=0;

  // Reinicia música se estava tocando
  try{ const b=document.getElementById('bgm'); if(b){ b.currentTime=0; b.play().catch(()=>{}); musicStarted=true; } }catch(e){}
}

// ── INPUT ─────────────────────────────────────────────────────────────────
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  startMusic();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  const tx=(t.clientX-r.left)*(W/r.width),ty=(t.clientY-r.top)*(H/r.height);
  if(state==='start'){showNameModal();return;}
  if(state==='tutorial'){startGame();return;}
  if(state==='gameover'){startGame();return;}
  if(specialReady&&tx>=BTN.x&&tx<=BTN.x+BTN.w&&ty>=BTN.y&&ty<=BTN.y+BTN.h){fireSpecial();return;}
  touchX=tx;touchY=ty;touching=true;
},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=canvas.getBoundingClientRect();touchX=(t.clientX-r.left)*(W/r.width);touchY=(t.clientY-r.top)*(H/r.height);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();touching=false;},{passive:false});
canvas.addEventListener('click',e=>{
  startMusic();
  const r=canvas.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(W/r.width),cy=(e.clientY-r.top)*(H/r.height);
  if(state==='start'){showNameModal();return;}
  if(state==='tutorial'){startGame();return;}
  if(state==='gameover'){startGame();return;}
  if(specialReady&&cx>=BTN.x&&cx<=BTN.x+BTN.w&&cy>=BTN.y&&cy<=BTN.y+BTN.h)fireSpecial();
});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();P.targetX=(e.clientX-r.left)*(W/r.width);P.targetY=(e.clientY-r.top)*(H/r.height);});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=true;
  if((e.key===' '||e.key==='Enter')&&(state==='start'))showNameModal();
  if((e.key===' '||e.key==='Enter')&&state==='tutorial')startGame();
  if((e.key===' '||e.key==='Enter')&&state==='gameover'){state='tutorial';}
  if((e.key==='x'||e.key==='Shift')&&state==='playing')fireSpecial();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=false;
});

loadAll(()=>{state='start';});
loop();
</script>
